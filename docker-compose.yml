# Витрина «Вопрошалыча»: адаптеры VK и MAX → bot-core → Dify (Chatflow).
# Логика ответов, база знаний и аналитика живут в Dify.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voproshalych}
      POSTGRES_USER: ${POSTGRES_USER:-voproshalych}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voproshalych}
    volumes:
      # Новый том: старая БД (pgvector/AGE, другая схема users) не переиспользуется.
      - bot_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot-core:
    build:
      context: ./bot-service
      dockerfile: core/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-voproshalych}
      POSTGRES_USER: ${POSTGRES_USER:-voproshalych}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voproshalych}
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      # Позволяет указать DIFY_API_URL=http://host.docker.internal/v1,
      # если Dify запущен на этом же сервере в своём compose.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  vk-bot:
    build:
      context: ./bot-service
      dockerfile: bots/vk/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOT_CORE_URL: ${BOT_CORE_URL:-http://bot-core:8000}
      BOT_CORE_TIMEOUT_SECONDS: ${BOT_CORE_TIMEOUT_SECONDS:-300}
      VK_BOT_TOKEN: ${VK_BOT_TOKEN}
    depends_on:
      bot-core:
        condition: service_healthy

  max-bot:
    build:
      context: ./bot-service
      dockerfile: bots/max/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOT_CORE_URL: ${BOT_CORE_URL:-http://bot-core:8000}
      BOT_CORE_TIMEOUT_SECONDS: ${BOT_CORE_TIMEOUT_SECONDS:-300}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN}
    depends_on:
      bot-core:
        condition: service_healthy

volumes:
  bot_postgres_data:
